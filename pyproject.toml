# =============================================================================
# Lambat Registry Bot — project metadata, tooling, and packaging config.
# =============================================================================
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lambat-registry-bot"
version = "1.1.0"
description = "Discord bot managing the citizen registry of the Lambat nation on CivMC."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "trinik15", email = "nicola.trinca15@gmail.com" }]
dependencies = [
    "aiohttp>=3.13.3",
    "discord-py>=2.6.4",
    "asyncpg>=0.29.0",
    "matplotlib>=3.7.0",
    # Phase 1 additions — these are now runtime deps (used by core/logging_config
    # and core/metrics, both imported at startup). Keep optional cloud SDKs out
    # of the base install; they're pulled in only when BACKUP_SINK needs them.
    "structlog>=24.1.0",
    "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
# Dev / CI tooling. Install with:  pip install -e ".[dev]"
dev = [
    "ruff>=0.6.0",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]
# Optional off-site backup sinks. Install only when BACKUP_SINK is configured.
s3 = ["boto3>=1.34"]
gcs = ["google-cloud-storage>=2.16"]
# Optional error tracking.
sentry = ["sentry-sdk>=2.0"]

[project.urls]
Homepage = "https://github.com/trinik15/LambatRegistryBot"

[tool.setuptools]
# We're a flat-layout application, not a distributable package. py-modules
# are discovered automatically; this entry just keeps setuptools quiet.
py-modules = []

# -----------------------------------------------------------------------------
# Ruff — lint + format (replaces black + flake8 + isort).
# -----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["backups", "build", "dist"]

[tool.ruff.lint]
# E/F/W = pycodestyle + pyflakes, I = isort, UP = pyupgrade,
# B = bugbear, SIM = simplify, C4 = comprehensions.
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]
ignore = [
    "E501",   # line length — handled by the formatter; long URLs/SQL are fine
    "B008",   # function call in default argument (used for discord app_commands)
    "SIM108", # ternary vs if/else — readability preference
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]  # assert False is fine in tests

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# -----------------------------------------------------------------------------
# Mypy — static type checking.
#
# Baseline policy (Phase 1): a GREEN, useful CI gate. We check untyped function
# bodies (check_untyped_defs) and flag returning Any, but we do NOT yet require
# every function to be typed (disallow_untyped_defs=false) — the existing
# codebase predates this policy. Tightening to strict on core/ and services/
# is the Phase 2 aspiration once their signatures get annotated.
# -----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
# warn_return_any is intentionally OFF for the Phase 1 baseline: asyncpg's
# fetchval/fetchrow and discord.py's attribute access return Any, which would
# cascade through the existing (untyped) codebase. Turn this on in Phase 2
# once core/services signatures are annotated.
warn_return_any = false
no_implicit_optional = true
show_error_codes = true
files = ["core", "services", "api", "tasks", "web", "utils.py", "main.py"]

# Cogs import a lot of discord app_commands decorators that mypy struggles with;
# keep them lenient for now.
[[tool.mypy.overrides]]
module = ["cogs.*"]
disallow_untyped_defs = false

# numpy's bundled stubs (pulled in transitively via matplotlib) use Python 3.12
# `type` statement syntax that mypy in 3.11-target mode can't parse. This is a
# numpy-stub issue, not ours — ignore errors inside numpy itself so our own
# type-checking isn't blocked by a third-party stub.
[[tool.mypy.overrides]]
module = ["numpy.*"]
ignore_errors = true

# -----------------------------------------------------------------------------
# Pytest
# -----------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra -q"
filterwarnings = [
    "ignore::DeprecationWarning:discord.*",
]
